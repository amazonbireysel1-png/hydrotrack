<style>
/* layout: single committed world — deep navy jewel-arcade, 8x8 board, 3-piece tray, glowing line-clear bursts. */
:root{
  --bg1:#5f78d9; --bg2:#3a4fac; --board:#232d63; --line:rgba(255,255,255,.09);
  --fg:#ffffff; --muted:#c3ccf7; --accent:#ffd166; --good:#18c98a;
  color-scheme:dark;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--fg); font-family:'Nunito',sans-serif; display:flex; justify-content:center; overflow:hidden; user-select:none; touch-action:none; }
.app{ width:100%; max-width:500px; height:100%; display:flex; flex-direction:column; gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 10px); }
.top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.levelchip{ display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.22); border-radius:14px; padding:8px 16px; border:1.5px solid rgba(255,255,255,.15); }
.levelchip .ico{ font-size:20px; }
.levelchip .v{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; color:var(--accent); }
.score{ display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.22); border-radius:14px; padding:8px 16px; border:1.5px solid rgba(255,255,255,.15); }
.score .ico{ font-size:18px; }
.score .v{ font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
.bigscore{ text-align:center; font-family:'Baloo 2',sans-serif; font-size:44px; font-weight:800; color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.2); margin:2px 0 -4px; }
.progress-wrap{ background:rgba(0,0,0,.25); border-radius:10px; height:10px; overflow:hidden; border:1px solid rgba(255,255,255,.15); }
.progress-bar{ height:100%; background:linear-gradient(90deg,#4fe0a0,#ffd166); width:0%; transition:width .3s ease; }
.board-wrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
#board{ position:relative; width:100%; max-width:460px; aspect-ratio:1; background:var(--board); border-radius:16px;
  border:3px solid rgba(255,255,255,.18); box-shadow:inset 0 2px 10px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.25); overflow:hidden;
  transition:background-color 1.4s ease; }
.bgcell{ position:absolute; background:transparent; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.bgcell.hi{ box-shadow:inset 0 0 0 2px var(--good); }
.bgcell.bad{ box-shadow:inset 0 0 0 2px #ff5d7d; }
.block{ position:absolute; border-radius:7px; border:3px solid #000;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.5), 0 3px 7px rgba(0,0,0,.3); }
.block.willclear{ background:linear-gradient(160deg,#fff6a8,#ffb300) !important; animation:willPulse .45s ease-in-out infinite alternate; z-index:15; }
@keyframes willPulse{ from{ filter:brightness(1); } to{ filter:brightness(1.4); } }
.stars.sad{ font-size:84px; letter-spacing:0; line-height:1.1; animation:sadDrop 1.2s ease-out both; }
@keyframes sadDrop{ 0%{ transform:translateY(-40px) scale(.4); opacity:0; } 60%{ transform:translateY(6px) scale(1.1); opacity:1; } 100%{ transform:none; opacity:1; } }
.block.clearing{ animation:clearPop .5s cubic-bezier(.2,.8,.3,1) forwards; z-index:20; will-change:transform,opacity; }
@keyframes clearPop{
  0%{ transform:scale(1) rotate(0deg); opacity:1; box-shadow:0 0 0 rgba(255,224,102,0);}
  18%{ transform:scale(1.22) rotate(-3deg); opacity:1; box-shadow:0 0 10px 3px rgba(255,224,102,.75);}
  45%{ transform:scale(1.25) rotate(2deg); opacity:.8;}
  100%{ transform:scale(0) rotate(0deg); opacity:0;}
}
#board.shake{ animation:boardShake .5s ease; }
@keyframes boardShake{
  0%,100%{ transform:translate(0,0); }
  15%{ transform:translate(-7px,4px) rotate(-0.6deg); }
  30%{ transform:translate(6px,-5px) rotate(0.6deg); }
  45%{ transform:translate(-5px,3px) rotate(-0.4deg); }
  60%{ transform:translate(4px,-3px) rotate(0.4deg); }
  75%{ transform:translate(-2px,2px); }
}
.flash-overlay{ position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60; }
.flash-overlay.show{ animation:flashOut .4s ease-out forwards; }
@keyframes flashOut{ 0%{opacity:var(--flash-peak,.55);} 100%{opacity:0;} }
.tray{ display:flex; gap:8px; justify-content:center; min-height:96px; align-items:center; }
.tray-slot{ flex:1; max-width:118px; aspect-ratio:1.15; position:relative; }
.tray-piece{ position:absolute; inset:0; cursor:grab; }
.tray-piece.used{ visibility:hidden; }
.combo-float{ position:fixed; z-index:80; font-family:'Baloo 2',sans-serif; font-weight:800; pointer-events:none;
  text-shadow:0 3px 8px rgba(0,0,0,.4); opacity:0; }
.combo-float.show{ animation:comboUp 1.3s ease-out forwards; }
@keyframes comboUp{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.5) rotate(-6deg);} 10%{opacity:1; transform:translate(-50%,-50%) scale(1.25) rotate(3deg);} 22%{transform:translate(-50%,-50%) scale(1.05) rotate(-2deg);} 80%{opacity:1; transform:translate(-50%,-120%) scale(1.1) rotate(0deg);} 100%{opacity:0; transform:translate(-50%,-190%) scale(1.1);} }
.spark{ position:fixed; z-index:79; width:7px; height:7px; border-radius:50%; pointer-events:none; opacity:0; }
.spark.show{ animation:sparkOut .7s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes sparkOut{ 0%{opacity:1; transform:translate(0,0) scale(1);} 70%{opacity:1;} 100%{opacity:0; transform:var(--dxy) scale(.4);} }
.confetti{ position:fixed; z-index:77; width:8px; height:13px; pointer-events:none; opacity:0; will-change:transform,opacity; }
.confetti.show{ animation:confettiFall 1s ease-in forwards; }
@keyframes confettiFall{ 0%{ opacity:1; transform:translateY(0) rotate(0deg);} 100%{ opacity:0; transform:translateY(240px) rotate(420deg);} }
.bomb-ring{ position:fixed; z-index:78; width:20px; height:20px; margin-left:-10px; margin-top:-10px; border-radius:50%;
  border:6px solid #ff6a00; opacity:0; pointer-events:none; transform:scale(.3); will-change:transform,opacity; }
.bomb-ring.show{ animation:bombRing .5s ease-out forwards; }
@keyframes bombRing{ 0%{ opacity:1; transform:scale(.3);} 100%{ opacity:0; transform:scale(7);} }
.bomb-cell{ display:flex; align-items:center; justify-content:center; animation:bombPulse .9s ease-in-out infinite; }
.bomb-label{ position:absolute; left:0; right:0; bottom:-2px; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12px; letter-spacing:1px; color:#fff3b0; text-shadow:0 0 8px #ff6a00, 0 2px 4px rgba(0,0,0,.6); pointer-events:none; }
@keyframes bombPulse{ 0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,106,0,.55), inset 0 -5px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.3);} 50%{ transform:scale(1.1); box-shadow:0 0 22px 9px rgba(255,106,0,.85), inset 0 -5px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.3);} }
.ghost{ position:fixed; z-index:70; pointer-events:none; opacity:.92; }
.ghost .block{ position:absolute; }
.overlay{ position:fixed; inset:0; background:rgba(6,8,20,.65); display:flex; align-items:center; justify-content:center; padding:20px; z-index:90; }
.overlay[hidden]{ display:none; }
.modal{ background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:24px; max-width:300px; width:100%; text-align:center; }
.modal h2{ font-family:'Baloo 2',sans-serif; margin:0 0 8px; font-size:20px; }
.stars{ font-size:30px; letter-spacing:4px; margin:6px 0 10px; }
.modal p{ color:var(--muted); font-weight:700; font-size:13px; margin:0 0 14px; }
.modal button{ appearance:none; border:none; border-radius:13px; padding:12px 16px; background:var(--accent); color:#3a2400;
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:14px; width:100%; cursor:pointer; }
.modal button.as-link{ background:none !important; box-shadow:none !important; color:#8da2ff !important; text-decoration:underline; font-size:15px; padding:8px 12px; }
.modal button.as-link.faint{ opacity:.5; font-size:12px; padding:6px 10px; }
.go-league{ background:rgba(0,0,0,.22); border-radius:12px; padding:10px 12px; margin:0 0 12px; font-size:13px; font-weight:800; color:var(--fg); line-height:1.5; }
.go-league .gl-ch{ font-weight:800; }
.go-league .gl-ch.up{ color:#4fe0a0; } .go-league .gl-ch.down{ color:#ff9a9a; } .go-league .gl-ch.same{ color:var(--muted); }

.modal button.go-x{ position:absolute; top:5px; right:5px; width:26px; height:26px; padding:0; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; font-size:13px; line-height:26px; }
.go-league[hidden], .go-join[hidden]{ display:none; }
.ad-continue-btn{ background:linear-gradient(160deg,#4fe0a0,#18c98a) !important; color:#053323 !important; margin-bottom:10px; font-size:20px !important; padding:16px 18px !important; }
.rankbtn{ display:flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:14px;

  padding:9px 6px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; cursor:pointer; }
.rank-tab.active{ background:var(--accent); color:#3a2400; border-color:var(--accent); }

.league-head{ text-align:center; margin:-4px 0 10px; }
.league-head .lg-name{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; color:var(--accent); }
.league-head .lg-sub{ font-size:11.5px; font-weight:700; color:var(--muted); }
.rank-banner{ background:rgba(24,201,138,.15); border:1.5px solid var(--good); border-radius:11px; padding:8px 10px; font-size:12.5px; font-weight:700; text-align:center; }
.rank-row.up .num,.rank-row.up .mk{ color:var(--good); }
.rank-row.down .num,.rank-row.down .mk{ color:#ff6b6b; }
.rank-row .mk{ width:14px; font-size:11px; font-weight:800; text-align:center; }
.rank-empty{ text-align:center; color:var(--muted); font-weight:700; font-size:12.5px; padding:20px 0; }
.name-row{ display:flex; gap:6px; margin-bottom:6px; }
.name-row input{ flex:1; border-radius:10px; border:1.5px solid var(--line); background:rgba(0,0,0,.25); color:var(--fg);
  padding:9px 11px; font-family:'Nunito',sans-serif; font-weight:700; font-size:13.5px; min-width:0; }
.name-row input:focus{ outline:2px solid var(--accent); }
.name-row button{ width:auto; flex:none; padding:9px 16px; font-size:13px; }
.name-row select{ flex:none; max-width:96px; border-radius:10px; border:1.5px solid var(--line); background:rgba(0,0,0,.25); color:var(--fg);
  padding:9px 6px; font-family:'Nunito',sans-serif; font-weight:700; font-size:12.5px; }
.rank-close{ margin-top:2px; }
.settings-modal{ max-width:340px; }
.settings-modal h2{ margin-bottom:16px; }
.set-row{ display:flex; justify-content:space-around; margin-bottom:6px; }
.set-item{ display:flex; flex-direction:column; align-items:center; gap:8px; width:84px; }
.set-toggle{ position:relative; width:56px; height:56px; border-radius:16px; background:rgba(0,0,0,.28); border:1.5px solid rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; appearance:none; color:var(--fg); }
.set-toggle.off{ opacity:.4; }
.set-toggle .dot{ position:absolute; top:-4px; right:-4px; width:14px; height:14px; border-radius:50%; background:#ff4757;
  border:2px solid var(--panel); display:none; }
.set-toggle.off .dot{ display:block; }
.set-item .lbl{ font-weight:800; font-size:12.5px; color:var(--muted); }
.vib-slider{ display:flex; align-items:center; gap:6px; margin-top:16px; }
.vib-slider button{ width:26px; height:26px; border-radius:8px; padding:0; font-size:15px; line-height:1; flex:none; }
.vib-slider input[type=range]{ flex:1; accent-color:var(--accent); }
.boosters{ display:flex; justify-content:center; gap:14px; margin:2px 0 4px; }
.boost-btn{ position:relative; width:52px; height:52px; border-radius:16px; background:rgba(0,0,0,.22);
  border:1.5px solid rgba(255,255,255,.15); font-size:22px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; appearance:none; color:inherit; }
.boost-btn.empty{ opacity:.55; }
.boost-btn .cnt{ position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;

.boost-btn .streak-tip{ position:absolute; bottom:-16px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); font-weight:800; white-space:nowrap; }
.bgcell.hint{ box-shadow:inset 0 0 0 2px #4fe0a0; animation:hintPulse 1s ease-in-out infinite; }

.ad-modal{ text-align:center; }

@keyframes spin{ to{ transform:rotate(360deg); } }
</style>

function hslToHex(h,s,l){

  return '#'+toHex(r)+toHex(g)+toHex(b);

  var stage=Math.floor(score/BOARD_STEP);

  return {
    board: hslToHex(hue, sat, boardL),

  var cats={small:[],tromino:[],tetromino:[],penta:[],big:[]};

    if (s.length<=2) cats.small.push(s);

function pickWeightedShape(s){
  var score=s||0;

  // eskiden 8000'de tam zora ulaşıyordu) — oyun ilk başlarda uzun süre akıcı/hızlı hissettirsin.
  // üstüne üstlük eğriyi (^1.4) büktük: başlarda t çok daha yavaş yükseliyor, yani oyunun İLK bölümü
  // eskisinden de kolay kalıyor, zorluk ancak oyunun sonlarına doğru asıl hızlanıyor.

  // not: "small" kategorisinde çok az şekil var (tekli/ikili), eskiden ağırlığı çok yüksekti (%52) —

  if (score<3500){ w.penta=0; w.big=0; }
  var total=0; for (var k in w) total+=w[k];
  var r=Math.random()*total, cat=null;
  for (var k2 in w){ if (r<w[k2]){ cat=k2; break; } r-=w[k2]; }
  var arr=SHAPE_CATS[cat];

  // tahtanın kilitlenip oyunun aniden bitmesi ihtimali büyük ölçüde azaltıldı.
  if ((s||0)<35000) return 3;
  return 2;
}

    var r=r0+shape[i][0], c=c0+shape[i][1];

function triggerBombExplosion(r0, c0){

function resolveLines(){
  var fullRows=[], fullCols=[];
  for (var r=0;r<N;r++){ if (grid[r].every(function(c){return c;})) fullRows.push(r); }
  for (var c=0;c<N;c++){ var full=true; for (var r=0;r<N;r++) if (!grid[r][c]) full=false; if (full) fullCols.push(c); }
  var totalLines=fullRows.length+fullCols.length;
  if (totalLines>0){
    resolving=true;
    var cellsToClear=new Set();
    fullRows.forEach(function(r){ for (var c=0;c<N;c++) cellsToClear.add(r+'-'+c); });
    fullCols.forEach(function(c){ for (var r=0;r<N;r++) cellsToClear.add(r+'-'+c); });
    var rect=boardEl.getBoundingClientRect();
    var intensity = 1 + (totalLines-1)*0.35;
    var keys=Array.from(cellsToClear);
    keys.forEach(function(key){ var el=document.getElementById('blk-'+key); if (el) el.classList.add('clearing'); });
    shakeBoard();
    screenFlash(totalLines>1 ? 1 : 0.4); // tek satırda da hafif bir parlama olsun, tamamen sessiz/sönük kalmasın
    if (totalLines>1){ confettiBurst(rect.left+rect.width/2, rect.top-20); }
    if (score>=3000 && (totalLines>=2 || Math.random()<0.2) && !trayPieces.some(function(p){return p.isBomb && !p.used;})){
      pendingBombPiece=true;
      var unusedForBomb=[]; trayPieces.forEach(function(p,i){ if(!p.used && !p.isBomb) unusedForBomb.push(i); });
      if (unusedForBomb.length){
        var bombIdx=unusedForBomb[Math.floor(Math.random()*unusedForBomb.length)];
        trayPieces[bombIdx]=makeBombPiece();
        pendingBombPiece=false;
        renderTray();
      }
    }
    // patlamalar tek seferde değil, dalga dalga (soldan sağa/yukarıdan aşağı) ağırdan patlasın
    keys.sort(function(a,b){
      var pa=a.split('-').map(Number), pb=b.split('-').map(Number);
      return (pa[0]+pa[1]) - (pb[0]+pb[1]);
    });
    var waveSpan=340; // ms - tüm dalganın yayılma süresi
    // performans: çok sayıda hücre aynı anda patlarken (çoklu satır/sütun) her hücreye kıvılcım koymak kasmaya sebep oluyordu.
    // en fazla ~18 hücreye kıvılcım koy, geri kalanlar sadece kendi block.clearing animasyonuyla (zaten gösterişli) patlasın.
    var maxBursts=18;
    var burstStep = keys.length>maxBursts ? Math.ceil(keys.length/maxBursts) : 1;
    keys.forEach(function(key,i){
      var el=document.getElementById('blk-'+key);
      if (!el) return;
      var delay = keys.length>1 ? (i/(keys.length-1))*waveSpan : 0;
      if (i%burstStep===0){
        setTimeout(function(){
          var er=el.getBoundingClientRect();
          burstSpark(er.left+er.width/2, er.top+er.height/2, el.dataset.color||'#ffd166', intensity);
        }, delay);
      }
    });
    var bonus = totalLines*130 + Math.max(0,totalLines-1)*90; // skor hızlı yükselsin, tatmin edici olsun
    score += bonus;
    sfxClear(totalLines); vibrate(totalLines>1 ? [vibLevelMs(),40,vibLevelMs(),40,vibLevelMs()] : [vibLevelMs(),40,vibLevelMs()]);
    var comboText = totalLines>1 ? ('COMBO x'+totalLines+'  +'+bonus) : ('+'+bonus);
    setTimeout(function(){
      floatCombo(rect.left+rect.width/2, rect.top+rect.height*0.35, comboText, totalLines>1?'#ffd166':'#4fe0a0', totalLines>1);
    }, waveSpan*0.3);
    setTimeout(function(){
      cellsToClear.forEach(function(key){ var parts=key.split('-'); grid[+parts[0]][+parts[1]]=null; });
      renderGrid(); updateScoreDisplay();
      resolving=false; refreshBoosterUI();
    }, waveSpan + 500);
  } else { updateScoreDisplay(); }
  if (trayPieces.every(function(p){return p.used;})) fillTray(); else checkNoMoves();
}
var pendingUnlockColors=null, pendingBombPiece=false;
function updateScoreDisplay(){

function attachPieceDrag(el, piece, idx, mini){
  el.addEventListener('pointerdown', function(ev){
    ev.preventDefault(); if (dragging) return; dragging=true;
    if (typeof sfxPickup==='function') sfxPickup(); vibrate(vibLevelMs()*0.4);
    var b=shapeBounds(piece.shape);
    var scale = cellSize/mini;
    var ghost=document.createElement('div'); ghost.className='ghost';
    var gw=b.cols*cellSize, gh=b.rows*cellSize;
    ghost.style.width=gw+'px'; ghost.style.height=gh+'px';
    piece.shape.forEach(function(p){
      var d=document.createElement('div'); d.className='block';
      d.style.width=cellSize+'px'; d.style.height=cellSize+'px';
      d.style.left=(p[1]*cellSize)+'px'; d.style.top=(p[0]*cellSize)+'px';
      d.style.background='linear-gradient(160deg,'+piece.gem.c1+','+piece.gem.c2+')';
      if (piece.isBomb){ d.classList.add('bomb-cell'); d.style.display='flex'; d.style.alignItems='center'; d.style.justifyContent='center'; d.style.fontSize=(cellSize*0.6)+'px'; d.textContent='💣'; }
      ghost.appendChild(d);
    });
    document.body.appendChild(ghost);
    var LIFT=90; // parmağın altında kalmasın diye bloğu parmaktan belirgin şekilde yukarıda göster
    function place(x,y){ ghost.style.left=(x-gw/2)+'px'; ghost.style.top=(y-gh-LIFT)+'px'; }
    place(ev.clientX, ev.clientY);
    function computeOrigin(x,y){
      var rect=boardEl.getBoundingClientRect();
      var topLeftX = x - gw/2, topLeftY = y - gh - LIFT;
      var c0 = Math.round((topLeftX-rect.left-PAD)/cellSize);
      var r0 = Math.round((topLeftY-rect.top-PAD)/cellSize);
      return {r0:r0,c0:c0};
    }
    var ghostCells=ghost.children;
    function unmark(){
      boardEl.querySelectorAll('.willclear').forEach(function(e){e.classList.remove('willclear');});
      for (var i=0;i<ghostCells.length;i++) ghostCells[i].classList.remove('willclear');
    }
    function markClears(ok,o){
      unmark(); if (!ok) return;
      if (piece.isBomb){
        for (var dr=-1;dr<=1;dr++) for (var dc=-1;dc<=1;dc++){ var e=document.getElementById('blk-'+(o.r0+dr)+'-'+(o.c0+dc)); if (e) e.classList.add('willclear'); }
        return;
      }
      var mine={}; piece.shape.forEach(function(p){ mine[(o.r0+p[0])+'-'+(o.c0+p[1])]=1; });
      function occ(r,c){ return !!grid[r][c] || !!mine[r+'-'+c]; }
      var rows=[], cols=[];
      for (var r=0;r<N;r++){ var f=true; for (var c=0;c<N;c++) if(!occ(r,c)){f=false;break;} if(f) rows.push(r); }
      for (var c2=0;c2<N;c2++){ var f2=true; for (var r2=0;r2<N;r2++) if(!occ(r2,c2)){f2=false;break;} if(f2) cols.push(c2); }
      if (!rows.length && !cols.length) return;
      function inLine(r,c){ return rows.indexOf(r)>=0 || cols.indexOf(c)>=0; }
      for (var rr=0;rr<N;rr++) for (var cc=0;cc<N;cc++){
        if (!inLine(rr,cc)) continue;
        var el=document.getElementById('blk-'+rr+'-'+cc); if (el) el.classList.add('willclear');
      }
      piece.shape.forEach(function(p,i){ if (inLine(o.r0+p[0], o.c0+p[1]) && ghostCells[i]) ghostCells[i].classList.add('willclear'); });
    }
    function clearHi(){ boardEl.querySelectorAll('.bgcell').forEach(function(e){e.classList.remove('hi','bad');}); }
    function onMove(mv){
      place(mv.clientX, mv.clientY);
      var o=computeOrigin(mv.clientX, mv.clientY);
      clearHi();
      var ok=canPlace(piece.shape,o.r0,o.c0);
      piece.shape.forEach(function(p){
        var r=o.r0+p[0], c=o.c0+p[1];
        var bg=document.getElementById('bg-'+r+'-'+c);
        if (bg) bg.classList.add(ok?'hi':'bad');
      });
      markClears(ok,o);
      onMove._last=o; onMove._ok=ok;
    }
    function onUp(up){
      window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp);
      clearHi(); unmark(); ghost.remove(); dragging=false;
      if (onMove._ok && onMove._last){ placePiece(piece, onMove._last.r0, onMove._last.c0); }
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp, {once:true});
  });
}

function flagOf(code){ if (!/^[A-Z]{2}$/.test(code||'')) return '🌐'; return String.fromCodePoint(127397+code.charCodeAt(0), 127397+code.charCodeAt(1)); }

var WEEK_MS=7*86400000, WEEK_EPOCH=Date.UTC(2024,0,1); // 1 Ocak 2024 = Pazartesi
function currentWeekId(){ return Math.floor((Date.now()-WEEK_EPOCH)/WEEK_MS); }
function weekEndsInMs(){ return WEEK_EPOCH+(currentWeekId()+1)*WEEK_MS-Date.now(); }
function moveCount(n){ return Math.min(MOVE_MAX, Math.floor(n/6)); } // küçük liglerde daha az yükselen/düşen
function nextTier(tier, rank, n){
  var k=moveCount(n);
  if (rank<=k) return Math.min(TIER_COUNT-1, tier+1);
  if (rank>n-k) return Math.max(0, tier-1);
  return tier;
}

/* Geçen haftanın ligine bakıp bu haftaki basamağı hesapla (sadece bir kez, kendi kaydı için) */
/* Uygulamayı silen/bırakan oyuncular (seen = son puan zamanı) listelerde yer işgal etmesin */
function isActive(v, maxDays, ref){ return !v || !v.seen || ((ref||Date.now()) - v.seen) <= maxDays*86400000; }
function resolveWeek(){
  var wk=currentWeekId();
  if (!me || !me.leagueId || me.weekId>=wk) return Promise.resolve(null);
  return fdb.collection('leagues').doc(me.leagueId).collection('members').orderBy('points','desc').get().then(function(snap){
    var wkEnd=WEEK_EPOCH+(me.weekId+1)*WEEK_MS;
    var docs=snap.docs.filter(function(d){ return d.id===myUid || isActive(d.data(), 15, wkEnd); });
    var n=docs.length, rank=n+1;
    docs.forEach(function(d,i){ if (d.id===myUid) rank=i+1; });
    var from=me.tier||0, to=nextTier(from, rank, n);
    var res={ from:from, to:to, rank:rank, n:n };
    me.tier=to; me.weekId=wk; me.leagueId=null; me.lastResult=res;
    lastResult=res;
    return fdb.collection('players').doc(myUid).set({ name:me.name, tier:to, weekId:wk, leagueId:null, lastResult:res }, { merge:true }).then(function(){ return res; });
  });
}

/* Bu haftanın ligine katıl (ilk puan yazılırken). Sayaç dokümanı ile 30'ar kişilik gruplar oluşur. */
function joinLeague(){
  var wk=currentWeekId(), tier=me.tier||0;
  var cc=me.country||'OTHER';
  var cref=fdb.collection('counters').doc(wk+'_'+tier+'_'+cc);
  return fdb.runTransaction(function(tx){
    return tx.get(cref).then(function(cs){
      var cnt=cs.exists ? (cs.data().n||0) : 0;
      var lid=wk+'_'+tier+'_'+cc+'_'+Math.floor(cnt/LEAGUE_SIZE);
      var lref=fdb.collection('leagues').doc(lid);
      tx.set(cref,{ n:cnt+1 });
      tx.set(lref,{ tier:tier, weekId:wk, country:cc },{ merge:true });
      tx.set(lref.collection('members').doc(myUid),{ name:me.name, points:0 });
      tx.set(fdb.collection('players').doc(myUid),{ name:me.name, tier:tier, weekId:wk, leagueId:lid },{ merge:true });
      return lid;
    });
  }).then(function(lid){ me.weekId=wk; me.leagueId=lid; });
}

function addPoints(d){
  var wk=currentWeekId();
  return resolveWeek().then(function(){
    if (me.weekId!==wk || !me.leagueId) return joinLeague();
  }).then(function(){
    ptsSinceCache+=d;
    var inc=firebase.firestore.FieldValue.increment(d), cc=me.country||'OTHER';
    var rec={ name:me.name, country:cc, total:inc, seen:Date.now() };
    return Promise.all([
      fdb.collection('leagues').doc(me.leagueId).collection('members').doc(myUid).update({ points: inc, seen:Date.now() }),
      fdb.collection('boards').doc('ALL').collection('members').doc(myUid).set(rec,{ merge:true })
    ]);
  }).then(function(){ if (!rankOverlay.hidden) renderRank(); });
}

function drainPending(){
  if (!leagueOn || !me || !me.name || !me.country || pendingPoints<=0) return;
  var d=pendingPoints; pendingPoints=0;
  queue(function(){ return addPoints(d); });
}
/* Oyun bitince / yeni oyuna geçerken / uygulama arka plana gidince: o ana kadar kazanılan puanı lige ekle */
function flushScore(){
  var s=(typeof score==='number') ? score : 0;
  var d=s-(lastFlushedScore||0);
  if (!(d>0)) return;
  lastFlushedScore=s;
  pendingPoints+=d;
  drainPending();
}
document.addEventListener('visibilitychange', function(){ if (document.hidden) flushScore(); });
if (window.__restFlushed) lastFlushedScore=window.__restFlushed;

function renderLeague(){
  queue(function(){
    return resolveWeek().then(function(){
      var wk=currentWeekId();
      var left=tx('week_left',fmtLeft(weekEndsInMs()));
      var banner='';
      if (lastResult){
        var r=lastResult, t;
        if (r.to>r.from) t=tx('res_up',r.rank,tierName(r.to));
        else if (r.to<r.from) t=tx('res_down',r.rank,tierName(r.to));
        else t=tx('res_same',r.rank);
        banner='<div class="rank-banner">'+t+'</div>';
      }
      if (!me.leagueId || me.weekId!==wk){
        leagueHead.innerHTML='<div class="lg-name">'+tierName(me.tier||0)+'</div><div class="lg-sub">'+left+'</div>';
        rankList.innerHTML=banner+'<div class="rank-empty">'+tx('not_played')+'</div>';
        return;
      }
      return fdb.collection('leagues').doc(me.leagueId).collection('members').orderBy('points','desc').limit(LEAGUE_SIZE).get().then(function(snap){
        var docs=snap.docs.filter(function(d){ return d.id===myUid || isActive(d.data(), 15); });
        var n=docs.length, k=moveCount(n), html=banner;
        docs.forEach(function(d,i){
          var v=d.data(), rank=i+1, mine=(d.id===myUid);
          var zone = rank<=k ? ' up' : (rank>n-k ? ' down' : '');
          var mark = zone===' up' ? '▲' : (zone===' down' ? '▼' : '');
          html += '<div class="rank-row'+(mine?' me':'')+zone+'"><div class="num">'+rank+'</div><div class="nm">'+escapeHtml(v.name||'?')+'</div><div class="mk">'+mark+'</div><div class="sc">'+(v.points||0)+'</div></div>';
        });
        leagueHead.innerHTML='<div class="lg-name">'+tierName(me.tier||0)+'</div><div class="lg-sub">'+countryLabel(me.country)+' · '+left+(k>0?tx('move_info',k):'')+'</div>';
        rankList.innerHTML=html;
      });
    });
  });
}

/* ---- Oyun sonu: lig sıralaması + değişim + katıl penceresi ---- */
var lgCache=null, ptsSinceCache=0, JOINX_KEY='renklibloklar_joinx', LASTRANK_KEY='renklibloklar_lastrank';
function isJoined(){ return !!(me && me.name && me.country); }
function joinDismissed(){ try{ var t=parseInt(localStorage.getItem(JOINX_KEY)||'0',10); return t && (Date.now()-t) < 86400000; }catch(e){ return false; } }
function fetchGoRank(){
  return queue(function(){
    if (!leagueOn || !isJoined()) return null;
    return resolveWeek().then(function(){
      if (!me.leagueId || me.weekId!==currentWeekId()) return null;
      var lid=me.leagueId;
      var fresh = lgCache && lgCache.lid===lid && (Date.now()-lgCache.t)<60000;
      var rowsP;
      if (fresh){
        rowsP = Promise.resolve(lgCache.rows.map(function(r){ return { id:r.id, points: r.points + (r.id===myUid ? ptsSinceCache : 0), name:r.name, seen:r.seen }; }));
      } else {
        rowsP = fdb.collection('leagues').doc(lid).collection('members').orderBy('points','desc').limit(LEAGUE_SIZE).get().then(function(snap){
          var rows=snap.docs.map(function(d){ var v=d.data(); return { id:d.id, points:v.points||0, name:v.name, seen:v.seen }; });
          lgCache={ lid:lid, t:Date.now(), rows:rows }; ptsSinceCache=0; return rows;
        });
      }
      return rowsP.then(function(rows){
        rows=rows.filter(function(r){ return r.id===myUid || isActive(r, 15); }).sort(function(a,b){ return b.points-a.points; });
        var n=rows.length, rank=0;
        rows.forEach(function(r,i){ if (r.id===myUid) rank=i+1; });
        if (!rank) return null;
        var prev=null;
        try{ var o=JSON.parse(localStorage.getItem(LASTRANK_KEY)||'null'); if (o && o.lid===lid) prev=o.rank; }catch(e){}
        try{ localStorage.setItem(LASTRANK_KEY, JSON.stringify({ lid:lid, rank:rank })); }catch(e){}
        return { rank:rank, n:n, tier:me.tier||0, change: (prev==null ? null : prev-rank) };
      });
    });
  }).catch(function(){ return null; });
}
function startGoRank(){
  goRankLoading=true; goRankInfo=null;
  var tries=0;
  (function wait(){
    if (!leagueOn && !leagueErr && tries++<12) return setTimeout(wait, 400);
    fetchGoRank().then(function(info){
      goRankInfo=info; goRankLoading=false;
      if (over && !overlay.hidden && goStage===2) renderGoResult();
    });
  })();
}
function renderGoResult(){

var audioCtx=null;
function ac(){ if (!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function beep(freq,dur,type,vol){
  if (!settings.sound) return;
  var c=ac(); if (!c) return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.value=0;
  o.connect(g); g.connect(c.destination);
  var t=c.currentTime;
  g.gain.linearRampToValueAtTime(vol||0.14, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxPlace(){ beep(320,0.09,'triangle',0.12); }
function sfxPickup(){ beep(700,0.045,'sine',0.05); }
function noiseBurst(dur, vol, freq){
  if (!settings.sound) return;
  var c=ac(); if (!c) return;
  var bufSize=Math.floor(c.sampleRate*dur);
  var buf=c.createBuffer(1, bufSize, c.sampleRate);
  var data=buf.getChannelData(0);
  for (var i=0;i<bufSize;i++){ data[i]=(Math.random()*2-1)*(1-i/bufSize); }
  var src=c.createBufferSource(); src.buffer=buf;
  var filt=c.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=freq||1800; filt.Q.value=0.8;
  var g=c.createGain(); g.gain.value=vol||0.12;
  src.connect(filt); filt.connect(g); g.connect(c.destination);
  src.start(); src.stop(c.currentTime+dur+0.02);
}
function sfxClear(lines){
  var base=520;
  for (var i=0;i<Math.min(lines,4);i++){ (function(i){ setTimeout(function(){ beep(base+i*130,0.16,'square',0.13); }, i*70); })(i); }
  // normal tek çizgi patlaması hafif bir "pat" sesiyle taçlansın
  noiseBurst(0.12, 0.10, 2400);
  if (lines>1){
    // büyük kombo: ekstra derin "boom" + daha sert kırılma sesi
    beep(95,0.34,'sine',0.24);
    setTimeout(function(){ beep(65,0.28,'triangle',0.16); }, 60);
    setTimeout(function(){ noiseBurst(0.22, 0.16, 1200); }, 40);
  }
  voiceCallout(lines);
}
var lastCalloutAt=0;
// konuşma/sesli kelime yerine kısa, eğlenceli bir "jingle" (küçük nota dizisi) — insan sesi yok, sadece müzikal bir "ta-da"
function playJingle(notes, noteDur, type, vol){
  if (!settings.sound) return;
  notes.forEach(function(freq,i){ setTimeout(function(){ beep(freq, noteDur, type||'square', vol||0.12); }, i*noteDur*620); });
}
function voiceCallout(lines){
  // oyun "kalas gibi/cansız" hissettiriyordu — artık tek satır temizlemede de (düşük ihtimalle)
  // kısa eğlenceli bir jingle çalıyor, böylece en sık olan an da hayat buluyor (konuşma YOK, sadece müzik)
  if (!settings.sound) return;
  var now=Date.now();
  if (now-lastCalloutAt<1200) return; // art arda üst üste binmesin diye çok kısa bir bekleme
  var chance = lines>=4 ? 1 : (lines>=2 ? 0.8 : 0.22);
  if (Math.random()>chance) return;
  lastCalloutAt=now;
  if (lines>=4) playJingle([523,659,784,1047], 0.09, 'square', 0.14);       // büyük kombo: neşeli 4 nota
  else if (lines>=2) playJingle([587,784,988], 0.1, 'square', 0.13);        // kombo: kısa 3 nota
  else playJingle([659,880], 0.08, 'triangle', 0.1);                        // tekli: ufak 2 nota "ting"
}
var bgmState=null;
var BGM_CHORDS=[
  [261.63,329.63,392.00,493.88], // Cmaj7
  [220.00,261.63,329.63,392.00], // Am7
  [174.61,220.00,261.63,349.23], // Fmaj7
  [196.00,246.94,293.66,392.00]  // G
];
function startBgm(){
  if (!settings.bgm) return;
  var c=ac(); if (!c) return;
  if (bgmState) return;
  var master=c.createGain(); master.gain.value=0; master.connect(c.destination);
  master.gain.linearRampToValueAtTime(0.075, c.currentTime+1.4);
  var filter=c.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=1100; filter.Q.value=0.6;
  filter.connect(master);
  var st={master:master, filter:filter, timer:null, idx:0, stopped:false};
  bgmState=st;
  var chordDur=4.6;
  function playChord(freqs,startTime){
    freqs.forEach(function(f){
      var o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      var g=c.createGain(); g.gain.value=0;
      o.connect(g); g.connect(st.filter);
      g.gain.linearRampToValueAtTime(0.15/freqs.length, startTime+1.5);
      g.gain.linearRampToValueAtTime(0.0, startTime+chordDur-0.4);
      o.start(startTime); o.stop(startTime+chordDur+0.05);
      var lfo=c.createOscillator(); lfo.frequency.value=0.12+Math.random()*0.1;
      var lg=c.createGain(); lg.gain.value=2.2;
      lfo.connect(lg); lg.connect(o.detune);
      lfo.start(startTime); lfo.stop(startTime+chordDur+0.05);
    });
  }
  function scheduleNext(){
    if (st.stopped) return;
    var t=c.currentTime+0.05;
    playChord(BGM_CHORDS[st.idx%BGM_CHORDS.length], t);
    st.idx++;
    st.timer=setTimeout(scheduleNext, chordDur*1000*0.9);
  }
  scheduleNext();
}
function stopBgm(){
  if (bgmState){
    var st=bgmState; st.stopped=true;
    if (st.timer) clearTimeout(st.timer);
    try{ var c=ac(); st.master.gain.linearRampToValueAtTime(0, c.currentTime+0.5); }catch(e){}
    setTimeout(function(){ try{ st.master.disconnect(); }catch(e){} }, 600);
    bgmState=null;
  }
}
function vibrate(pattern){
  if (!settings.vib) return;
  if (navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
}
function vibLevelMs(){ return 8 + settings.vibLevel*8; }

/* ---- Boosterlar (Geri Al / Karıştır / İpucu) + günlük ödül ---- */
var boostUndo=document.getElementById('boostUndo'), boostShuffle=document.getElementById('boostShuffle'), boostHint=document.getElementById('boostHint');
var cntUndo=document.getElementById('cntUndo'), cntShuffle=document.getElementById('cntShuffle'), cntHint=document.getElementById('cntHint');
var dailyOverlay=document.getElementById('dailyOverlay'), dailyStreakText=document.getElementById('dailyStreakText'), dailyRewardText=document.getElementById('dailyRewardText'), dailyBtn=document.getElementById('dailyBtn');
var adOverlay=document.getElementById('adOverlay'), adTitle=document.getElementById('adTitle'), adText=document.getElementById('adText');
var daily={ lastDate:null, streak:0, charges:{undo:0, shuffle:0, hint:0} };
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function loadDaily(){
  try{
    var raw=localStorage.getItem('renklibloklar_daily');
    if (raw) daily=Object.assign(daily, JSON.parse(raw));
  }catch(e){}
}
function saveDaily(){ try{ localStorage.setItem('renklibloklar_daily', JSON.stringify(daily)); }catch(e){} }
function checkDailyReward(){
  var tk=todayKey();
  if (daily.lastDate===tk) return; // bugün zaten alındı
  var isFirstEver = !daily.lastDate;
  var yest=new Date(); yest.setDate(yest.getDate()-1);
  var yk=yest.getFullYear()+'-'+(yest.getMonth()+1)+'-'+yest.getDate();
  daily.streak = (daily.lastDate===yk) ? (daily.streak+1) : 1;
  daily.lastDate=tk;
  var reward={undo:1, shuffle:1, hint:1};
  if (daily.streak%3===0){ reward.undo++; reward.shuffle++; reward.hint++; }
  daily.charges.undo=(daily.charges.undo||0)+reward.undo;
  daily.charges.shuffle=(daily.charges.shuffle||0)+reward.shuffle;
  daily.charges.hint=(daily.charges.hint||0)+reward.hint;
  saveDaily();
  refreshBoosterUI();
  if (isFirstEver) return; // ilk açılışta popup gösterme, sessizce yükle
  dailyStreakText.textContent=tx('streak',daily.streak);
  dailyRewardText.textContent='+'+reward.undo+' 🔙 '+tx('undo')+'   +'+reward.shuffle+' 🔀 '+tx('shuffle')+'   +'+reward.hint+' 💡 '+tx('hint');
  dailyOverlay.hidden=false;
}
function refreshBoosterUI(){
  cntUndo.textContent=daily.charges.undo||0;
  cntShuffle.textContent=daily.charges.shuffle||0;
  cntHint.textContent=daily.charges.hint||0;
  boostUndo.classList.toggle('empty', !(daily.charges.undo>0) || !undoSnapshot || resolving);
  boostShuffle.classList.toggle('empty', !(daily.charges.shuffle>0) || resolving);
  boostHint.classList.toggle('empty', !(daily.charges.hint>0) || resolving);
}
function watchAdFor(type, label){
  adTitle.textContent=tx('ad_title'); adText.textContent=tx('reward_wait',label);
  adOverlay.hidden=false;
  setTimeout(function(){
    adOverlay.hidden=true;
    daily.charges[type]=(daily.charges[type]||0)+1;
    saveDaily(); refreshBoosterUI();
  }, 1800);
}
function doHint(){
  var avail=trayPieces.filter(function(p){return !p.used;});
  var spot=null, spotPiece=null;
  for (var i=0;i<avail.length && !spot;i++){
    for (var r=0;r<N && !spot;r++) for (var c=0;c<N && !spot;c++){
      if (canPlace(avail[i].shape,r,c)){ spot={r0:r,c0:c}; spotPiece=avail[i]; }
    }
  }
  if (!spot) return;
  spotPiece.shape.forEach(function(p){
    var bg=document.getElementById('bg-'+(spot.r0+p[0])+'-'+(spot.c0+p[1]));
    if (bg) bg.classList.add('hint');
  });
  setTimeout(function(){
    boardEl.querySelectorAll('.bgcell.hint').forEach(function(e){ e.classList.remove('hint'); });
  }, 1800);
}
boostUndo.addEventListener('click', function(){
  if (resolving) return;
  if (!(daily.charges.undo>0)){ watchAdFor('undo','🔙 '+tx('undo')); return; }
  if (!undoSnapshot) return;
  daily.charges.undo--; saveDaily();
  grid=undoSnapshot.grid; score=undoSnapshot.score; trayPieces=undoSnapshot.trayPieces;
  undoSnapshot=null;
  renderGrid(); renderTray(); scoreVal.textContent=score; hudScoreVal.textContent=score;
  refreshBoosterUI();
});
boostShuffle.addEventListener('click', function(){
  if (resolving) return;
  if (!(daily.charges.shuffle>0)){ watchAdFor('shuffle','🔀 '+tx('shuffle')); return; }
  daily.charges.shuffle--; saveDaily();
  fillTray();
  refreshBoosterUI();
});
boostHint.addEventListener('click', function(){
  if (resolving) return;
  if (!(daily.charges.hint>0)){ watchAdFor('hint','💡 '+tx('hint')); return; }
  daily.charges.hint--; saveDaily();
  doHint();
  refreshBoosterUI();
});
/* "Nasıl oynanır" penceresi: ilk açılışta bir kere (günlük ödül penceresi açıksa o kapanınca), ayarlardan istenince tekrar */
var howOverlay=document.getElementById('howOverlay'), howBtn=document.getElementById('howBtn'), howOpenBtn=document.getElementById('howOpenBtn');
function howSeen(){ try{ return !!localStorage.getItem('renklibloklar_howto'); }catch(e){ return true; } }
function openHow(){ howOverlay.hidden=false; }
function closeHow(){ howOverlay.hidden=true; try{ localStorage.setItem('renklibloklar_howto','1'); }catch(e){} }
howBtn.addEventListener('click', closeHow);
howOpenBtn.addEventListener('click', function(){ settingsOverlay.hidden=true; openHow(); });
dailyBtn.addEventListener('click', function(){ dailyOverlay.hidden=true; if (!howSeen()) openHow(); });
loadDaily();
checkDailyReward();
if (!howSeen() && dailyOverlay.hidden) openHow();
refreshBoosterUI();
})();
</script>
